<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/css/style.css" />
    <link
      rel="shortcut icon"
      href="/src/assets/images/icons/fav_dollar.png"
      type="image/x-icon"
    />
    <script src="https://unpkg.com/typewriter-effect@latest/dist/core.js"></script>
    <title>Schulden App</title>
  </head>
  <body>
    <div class="container">
      <header class="header-container">
        <h1 id="typs"></h1>
        <div class="icon-container">
          <img
            class="folder-open"
            src="/src/assets/images/icons/folder-open.svg"
            alt=""
          />
          <img class="euro" src="/src/assets/images/icons/euro.svg" alt="" />
        </div>
      </header>
      <main class="page-content">
        <section class="card">
          <section class="card-input">
            <header class="card-input-heading">
              <h2>Fall Eingabe</h2>
            </header>
            <form action="#" class="form-input" role="text" id="creditor-form">
              <div class="form-row">
                <label for="aktenzeichen">Az:</label>
                <input
                  type="text"
                  name="aktenzeichen"
                  id="aktenzeichen"
                  required
                />
              </div>
              <div class="form-row">
                <label for="creditor">Gläubiger:</label>
                <input
                  type="text"
                  name="creditor"
                  id="creditor"
                  required
                  pattern="^[A-Za-zÄÖÜäöüß\s-]+$"
                />
              </div>
              <div class="form-row">
                <label for="pay">Betrag:</label>
                <input
                  id="pay"
                  name="pay"
                  type="number"
                  required
                  min="0"
                  step="0.01"
                  inputmode="numeric"
                />
              </div>
              <div class="form-row">
                <label for="date">Fällig am:</label>
                <input type="date" name="date" id="date" required />
              </div>
              <div class="form-row">
                <label for="status">Status:</label>
                <select name="status" id="state" required>
                  <option value="" selected disabled>Bitte wählen</option>
                  <option value="offen">offen</option>
                  <option value="bezahlt">bezahlt</option>
                  <option value="überfällig">überfällig</option>
                </select>
              </div>
              <div class="form-actions">
                <button
                  type="submit"
                  id="btn-save"
                  class="btn-default btn-primary"
                >
                  Speichern
                </button>
                <button
                  type="button"
                  id="btn-delete"
                  class="btn-default btn-danger"
                >
                  Löschen
                </button>
                <button
                  type="reset"
                  id="btn-reset"
                  class="btn-default btn-neutral"
                >
                  Zurücksetzen
                </button>
              </div>
            </form>
          </section>

          <div class="card-search">
            <header class="card-search-heading">
              <h2>Fall Suche</h2>
            </header>

            <form class="form-search" role="search">
              <label for="az-input" class="sr-only">Aktenzeichen-Input</label>
              <input
                type="search"
                name="az-input"
                id="input-search"
                placeholder="Hier Aktenzeichen angeben..."
              />
              <button
                type="submit"
                class="btn-default btn-search"
                id="btn-search"
              >
                Suchen
              </button>
            </form>
            <header class="card-search-heading card-list">
              <h2>Schuldenliste</h2>
            </header>
            <div class="table-wrap">
              <table class="debt-table">
                <thead>
                  <tr>
                    <th>Aktenz.</th>
                    <th>Gläubiger</th>
                    <th>Betrag</th>
                    <th>Fällig am</th>
                    <th>Status</th>
                  </tr>
                </thead>
                <tbody class="debt-tbody" id="tbody">
